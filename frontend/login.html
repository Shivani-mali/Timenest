<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link rel="stylesheet" href="./css/style.css" />
    <link rel="icon" type="image/png" href="./assets/logo.png">
    <title>TimeNest • Login</title>
  </head>
  <body class="auth-page">
    <header>
      <a href="./index.html" class="brand">
        <img src="./assets/logo.png" alt="TimeNest" class="header-logo">
        <h1>TimeNest</h1>
      </a>
      <nav>
        <a href="./index.html">Home</a>
        <button id="theme-toggle" title="Toggle theme">🌙</button>
      </nav>
    </header>
    <main>
      <section class="card auth-card">
        <h2>Welcome back</h2>
        <p class="muted mb-1">Stay focused and ship your best work.</p>

        <form id="login-form" class="auth-form">
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="you@example.com" required />
            <p class="helper-text" id="email-help">Enter the email you signed up with (example: you@example.com).</p>
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <div class="password-field">
              <input type="password" id="password" placeholder="••••••••" required />
              <button type="button" id="toggle-password" class="ghost-btn">Show</button>
            </div>
            <div class="auth-row-between">
              <p class="helper-text" id="password-help">Minimum 8 characters recommended.</p>
              <a href="#" class="link-muted">Forgot password?</a>
            </div>
          </div>

          <button type="submit" class="mt-1" id="login-submit">Sign in</button>
        </form>

        <div class="auth-divider mt-1"><span>or</span></div>
        <button id="google-login" class="secondary mt-1" style="display:flex;align-items:center;justify-content:center;gap:0.5rem;width:100%;">
          <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" style="width:18px;height:18px;">
          Continue with Google
        </button>

        <p id="login-status" class="muted mt-1"></p>
        <p class="muted text-center mt-1">
          Don't have an account?
          <a href="./register.html">Create one</a>
        </p>
      </section>
    </main>
    <script src="./js/theme.js"></script>
    <script src="./js/auth.js"></script>
    <script src="./js/firebase-config.js"></script>
    <script type="module">
      import { googleSignIn } from './js/firebase-auth.js';
      document.getElementById('google-login').onclick = googleSignIn;
    </script>
    <script>
      const form = document.getElementById('login-form');
      const statusEl = document.getElementById('login-status');
      const passwordInput = document.getElementById('password');
      const togglePasswordBtn = document.getElementById('toggle-password');

      togglePasswordBtn.addEventListener('click', () => {
        const isPassword = passwordInput.type === 'password';
        passwordInput.type = isPassword ? 'text' : 'password';
        togglePasswordBtn.textContent = isPassword ? 'Hide' : 'Show';
      });

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        statusEl.textContent = '';

        const email = document.getElementById('email').value.trim();
        const password = passwordInput.value;
        // simple email format check
        const emailIsValid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
        if (!email || !password) {
          statusEl.textContent = 'Please fill in both email and password.';
          return;
        }
        if (!emailIsValid) {
          statusEl.textContent = 'Please enter a valid email address (example: you@example.com).';
          return;
        }

        document.getElementById('login-submit').disabled = true;
        statusEl.textContent = 'Signing you in…';

        try {
          const res = await window.TimeNestAuth.login(email, password);
          if (res.ok) {
            statusEl.textContent = 'Signed in! Redirecting…';
            window.location.href = './dashboard.html';
          } else {
            statusEl.textContent = res.data?.error || `Login failed (${res.status})`;
          }
        } catch (err) {
          statusEl.textContent = 'Something went wrong. Please try again.';
        } finally {
          document.getElementById('login-submit').disabled = false;
        }
      });

    </script>
    <script src="https://files.bpcontent.cloud/2026/01/14/15/20260114155138-2XVSN1A9.js" defer></script>
  </body>
</html>
